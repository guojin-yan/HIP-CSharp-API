name: Ubuntu 24.04 Runtime release

on:
  push:
    tags:
      - 'runtime-ubuntu.24.04-v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing annotated tag, for example runtime-ubuntu.24.04-v7.2.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: runtime-ubuntu-24.04-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, publish, and verify Ubuntu 24.04 Runtime
    runs-on: ubuntu-24.04
    environment: runtime-production
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RELEASE_INPUT_TAG: ${{ inputs.release_tag }}
      RELEASE_REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout exact Runtime release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Resolve and validate Runtime release identity
        id: release
        shell: pwsh
        run: |
          $tag = '${{ inputs.release_tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = '${{ github.ref_name }}' }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = @(git tag --points-at HEAD | Where-Object { $_ -match '^runtime-ubuntu\.24\.04-v[0-9]+\.[0-9]+\.[0-9]+$' } | Select-Object -First 1)
          }
          if ($tag -notmatch '^runtime-ubuntu\.24\.04-v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Runtime release tag must use runtime-ubuntu.24.04-vMAJOR.MINOR.PATCH; found '$tag'."
          }
          $version = $Matches.version
          $tagType = (git cat-file -t $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagType -ne 'tag') {
            throw "Runtime release tag '$tag' must be an existing annotated tag."
          }
          $sha = (git rev-parse HEAD).Trim()
          $tagSha = (git rev-parse "$tag^{commit}").Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$' -or $tagSha -ne $sha) {
            throw "Runtime release tag '$tag' does not resolve to the checked-out commit."
          }
          $tagBody = (git cat-file tag $tag) -join "`n"
          if ($tagBody -notmatch '(?m)^Runtime-Package-SHA256: (?<packageSha256>[0-9a-f]{64})$') {
            throw "Runtime release tag '$tag' does not bind the cloud-validated package SHA-256."
          }
          $expectedPackageSha256 = $Matches.packageSha256
          if ($tagBody -notmatch '(?m)^Runtime-Package-Size: (?<packageSize>[1-9][0-9]*)$') {
            throw "Runtime release tag '$tag' does not bind the cloud-validated package size."
          }
          $expectedPackageSize = $Matches.packageSize
          $worktreeStatus = (git status --porcelain | Out-String).Trim()
          if ($worktreeStatus) { throw 'The Runtime release checkout is not clean.' }

          $projectVersion = (& dotnet msbuild ./pack/JYPPX.ROCm.HipSharp.Runtime.ubuntu.24.04-x64.csproj -nologo -getProperty:HipSharpUbuntu2404RuntimeVersion).Trim()
          if ($LASTEXITCODE -ne 0 -or $projectVersion -ne $version) {
            throw "Runtime tag version $version does not match HipSharpUbuntu2404RuntimeVersion '$projectVersion'."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "package_sha256=$expectedPackageSha256" >> $env:GITHUB_OUTPUT
          "package_size=$expectedPackageSize" >> $env:GITHUB_OUTPUT

      - name: Run Runtime supply-chain tests
        shell: pwsh
        run: |
          ./eng/test-runtime-supply-chain.ps1
          dotnet restore ./HipSharp.sln --locked-mode
          dotnet build ./HipSharp.sln --configuration Release --no-restore
          dotnet test ./tests/JYPPX.ROCm.HipSharp.ProjectQuality.Tests/JYPPX.ROCm.HipSharp.ProjectQuality.Tests.csproj --configuration Release --no-build --no-restore

      - name: Restore Runtime pack project
        shell: pwsh
        run: dotnet restore ./pack/JYPPX.ROCm.HipSharp.Runtime.ubuntu.24.04-x64.csproj --locked-mode

      - name: Build exact verified Runtime package
        id: package
        shell: pwsh
        run: |
          $packageOutput = ./eng/pack-runtime.ps1 -Platform ubuntu.24.04-x64 -Version '${{ steps.release.outputs.version }}'
          $package = @($packageOutput | Where-Object { $_ -match '\.nupkg$' } | Select-Object -Last 1)
          if ($package.Count -ne 1) { throw 'Runtime packaging did not return exactly one nupkg path.' }
          $package = $package[0]
          $package = (Resolve-Path -LiteralPath $package).Path
          $expectedName = 'JYPPX.ROCm.HIP.CSharp.API.Runtime.ubuntu.24.04-x64.${{ steps.release.outputs.version }}.nupkg'
          if ([System.IO.Path]::GetFileName($package) -cne $expectedName) { throw "Unexpected Runtime package: $package" }
          $sha256 = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $package).Length
          if ($sha256 -cne '${{ steps.release.outputs.package_sha256 }}' -or [string]$size -cne '${{ steps.release.outputs.package_size }}') {
            throw "Rebuilt Runtime package does not match the exact cloud-validated bytes bound by the annotated tag."
          }
          $hashFile = "$package.sha256"
          [System.IO.File]::WriteAllText($hashFile, "$sha256  $expectedName`n", [System.Text.UTF8Encoding]::new($false))
          "path=$package" >> $env:GITHUB_OUTPUT
          "hash_file=$hashFile" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

      - name: Confirm NuGet credential
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'The NUGET_API_KEY repository secret is missing.' }

      - name: Publish Runtime package to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push '${{ steps.package.outputs.path }}' --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --timeout 600 --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "NuGet push failed with exit code $LASTEXITCODE." }

      - name: Verify NuGet.org package and repository signature
        shell: pwsh
        run: |
          $id = 'jyppx.rocm.hip.csharp.api.runtime.ubuntu.24.04-x64'
          $version = '${{ steps.release.outputs.version }}'
          $uri = "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg"
          $download = Join-Path $env:RUNNER_TEMP "$id.$version.nupkg"
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 $uri -OutFile $download
              break
            }
            catch {
              if ($attempt -eq 30) { throw }
              Start-Sleep -Seconds 10
            }
          }
          dotnet nuget verify $download --all
          if ($LASTEXITCODE -ne 0) { throw "Published Runtime signature verification failed with exit code $LASTEXITCODE." }
          ./eng/verify-runtime-package.ps1 -PackagePath $download

      - name: Unlist obsolete generic Linux Runtime package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $legacyId = 'JYPPX.ROCm.HIP.CSharp.API.Runtime.linux-x64'
          $version = '${{ steps.release.outputs.version }}'
          $registrationId = $legacyId.ToLowerInvariant()
          $registrationUri = "https://api.nuget.org/v3/registration5-semver1/$registrationId/$version.json"
          try {
            $registration = Invoke-RestMethod -UseBasicParsing -TimeoutSec 30 $registrationUri
          }
          catch {
            if ($_.Exception.Response.StatusCode -eq [System.Net.HttpStatusCode]::NotFound) {
              Write-Host "The obsolete package version does not exist; nothing to unlist."
              exit 0
            }
            throw
          }
          if ($registration.listed -eq $false) {
            Write-Host "The obsolete package version is already unlisted."
            exit 0
          }
          dotnet nuget delete $legacyId $version --non-interactive --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "NuGet unlist failed with exit code $LASTEXITCODE." }

      - name: Publish GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $title = 'Ubuntu 24.04 Runtime ${{ steps.release.outputs.version }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag '${{ steps.package.outputs.path }}' '${{ steps.package.outputs.hash_file }}'
          }
          else {
            gh release create $tag '${{ steps.package.outputs.path }}' '${{ steps.package.outputs.hash_file }}' --verify-tag --title $title --notes "ROCm 7.2.1 Runtime package for Ubuntu 24.04 x64. NuGet package ID: JYPPX.ROCm.HIP.CSharp.API.Runtime.ubuntu.24.04-x64."
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed with exit code $LASTEXITCODE." }

      - name: Upload Runtime release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-ubuntu-24.04-release-${{ steps.release.outputs.version || 'unknown' }}
          if-no-files-found: warn
          path: |
            artifacts/runtime-packages/*.nupkg
            artifacts/runtime-packages/*.sha256
            artifacts/runtime-final/**
            artifacts/package-audit/**
