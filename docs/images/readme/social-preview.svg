<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">HIP CSharp API social preview</title>
  <desc id="desc">A playful developer desk scene showing C# code flowing through the HIP C ABI into an AMD GPU, with managed ownership, streams, graphs and HIPRTC capabilities.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#b4c6d8" opacity="0.48"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#22395c" flood-opacity="0.20"/>
    </filter>
    <filter id="small-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#22395c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#edf2f2"/>
  <rect x="40" y="32" width="1200" height="576" rx="34" fill="#fffdf8" stroke="#22395c" stroke-width="3"/>
