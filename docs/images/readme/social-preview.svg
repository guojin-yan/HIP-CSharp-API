        <text x="56" y="209" fill="#8bd9cf" font-size="10" font-weight="700">var gpu = new HipRuntime();</text>
        <text x="56" y="229" fill="#f2c46d" font-size="10" font-weight="800">gpu.Initialize();</text>
        <text x="56" y="249" fill="#70b8ff" font-size="10" font-weight="800">var device = gpu.GetDevice(0);</text>
