      <text x="32" y="21" fill="#167c73" font-size="13" font-weight="900" letter-spacing="0.8">AMD GPU  /  C#  /  .NET</text>
    </g>
    <text x="72" y="154" fill="#1d2e4d" font-size="60" font-weight="900">HIP CSharp API</text>
    <text x="76" y="190" fill="#52677f" font-size="21" font-weight="600">Write C#. Ship real GPU work.</text>

