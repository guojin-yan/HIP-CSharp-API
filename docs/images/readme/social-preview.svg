  <path d="M70 70H610M670 570H1210" stroke="#dbe4e7" stroke-width="2" stroke-dasharray="4 12"/>
  <rect x="62" y="286" width="1156" height="286" rx="24" fill="url(#dots)" opacity="0.38"/>

